# CharacterDate AI für iPhone – Cloud-Build bei Codemagic (Mac M2, 500 Gratis-Minuten im Monat)
#
# Einmalig in Codemagic: Teams → Global variables / App → Environment variables, Gruppe »appstore« mit
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (Inhalt der .p8-Datei)   – alle »Secret« anhaken.
# Starten: in Codemagic »Start new build« → Workflow »TestFlight«. Gebaut wird nur auf Knopfdruck (spart Minuten).
workflows:
  testflight:
    name: TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      xcode: latest
    scripts:
      - name: iOS-SDK prüfen (mindestens 26)
        script: |
          v=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          echo "iOS-SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "$v" -lt 26 ]; then echo "Kein iOS-26-SDK auf diesem Mac"; exit 1; fi
      - name: Projekt erzeugen
        script: |
          brew install xcodegen
          export DEVELOPMENT_TEAM="$(printf '%s' "$APPLE_TEAM_ID" | grep -oE '[A-Z0-9]{10}' | head -1)"
          xcodegen generate
      - name: Signatur, Archiv und Upload zu TestFlight
        script: |
          set -eo pipefail
          export RUNNER_TEMP="$CM_BUILD_DIR/tmp"; mkdir -p "$RUNNER_TEMP/keys"
          export GITHUB_ENV="$RUNNER_TEMP/env.txt"; : > "$GITHUB_ENV"
          export GITHUB_RUN_ID="cm-$BUILD_NUMBER"
          export GITHUB_RUN_NUMBER=$((1000 + BUILD_NUMBER))   # TestFlight-Laufnummer immer höher als die alten GitHub-Builds
          # Eingetragene Werte säubern (Leerzeichen, Anführungszeichen, Beschriftungen mitkopiert)
          export ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 | tr 'A-F' 'a-f')"
          export ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | grep -oE '[A-Z0-9]{10}' | head -1)"
          export APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | grep -oE '[A-Z0-9]{10}' | head -1)"
          export DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8"
          # Prüfhilfe ohne Geheimnis: Kennung, Länge und Fingerabdruck des ÖFFENTLICHEN Schlüssels
          echo "Schlüssel-Kennung: $ASC_KEY_ID · Team: $APPLE_TEAM_ID · Issuer-Länge: ${#ASC_ISSUER_ID} · Kennung-Länge: ${#ASC_KEY_ID} · Team-Länge: ${#APPLE_TEAM_ID}"
          echo "Erste Zeile: $(head -1 "$ASC_KEY_PATH") · Zeilen: $(wc -l < "$ASC_KEY_PATH")"
          echo "Fingerabdruck: $(openssl pkey -in "$ASC_KEY_PATH" -pubout -outform DER 2>/dev/null | shasum -a 256 | cut -c1-16)"
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" || python3 -m pip install --quiet "pyjwt[crypto]"
          python3 ci/signieren.py einrichten
          while IFS= read -r zeile; do [ -n "$zeile" ] && export "${zeile%%=*}=${zeile#*=}"; done < "$GITHUB_ENV"
          echo "Profile: $NX_PROFIL_APP | $NX_PROFIL_WIDGET | $NX_PROFIL_PUSH"
          xcodebuild -project CharacterDate.xcodeproj -scheme CharacterDate -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CharacterDate.xcarchive" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            MARKETING_VERSION="$(tr -d '[:space:]' < VERSION)" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--keychain $NX_KEYCHAIN" \
            NX_PROFIL_APP="$NX_PROFIL_APP" NX_PROFIL_WIDGET="$NX_PROFIL_WIDGET" NX_PROFIL_PUSH="$NX_PROFIL_PUSH" \
            archive | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key><dict>
              <key>de.infinitras.characterdate</key><string>${NX_PROFIL_APP}</string>
              <key>de.infinitras.characterdate.widget</key><string>${NX_PROFIL_WIDGET}</string>
              <key>de.infinitras.characterdate.push</key><string>${NX_PROFIL_PUSH}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -version
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CharacterDate.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" | tee export.log || true
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1)"
          if [ -z "$IPA" ]; then
            echo "Export ohne .ipa – Xcode-Protokolle:"; find /var/folders -name "IDEDistribution*.log" -newer archive.log 2>/dev/null | xargs -I{} sh -c 'tail -60 "{}"'
            exit 1
          fi
          echo "IPA: $IPA ($(du -h "$IPA" | cut -f1))"
          # Upload mit Apples Werkzeug (altool sucht den Schlüssel in ~/.appstoreconnect/private_keys)
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          ok=0
          for versuch in 1 2 3; do
            if xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal 2>&1 | tee -a upload.log; then
              if ! grep -qiE "error|failed" upload.log || grep -qiE "No errors uploading|UPLOAD SUCCEEDED" upload.log; then ok=1; break; fi
            fi
            echo "Upload-Versuch $versuch fehlgeschlagen – warte 30 s"; : > upload.log; sleep 30
          done
          if [ "$ok" != 1 ] && command -v app-store-connect >/dev/null; then
            echo "Ersatzweg: Codemagic-Werkzeug app-store-connect publish"
            app-store-connect publish --path "$IPA" --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" \
              --private-key "@file:$ASC_KEY_PATH" 2>&1 | tee -a upload.log && ok=1 || true
          fi
          rm -f ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          [ "$ok" = 1 ] || { echo "Upload zu TestFlight fehlgeschlagen"; exit 1; }
          echo "Hochgeladen: Version $(tr -d '[:space:]' < VERSION) ($GITHUB_RUN_NUMBER)"
      - name: Schlüssel löschen
        script: |
          RUNNER_TEMP="$CM_BUILD_DIR/tmp" python3 ci/signieren.py aufraeumen || true
          rm -rf "$CM_BUILD_DIR/tmp/keys"
    artifacts:
      - archive.log
      - export.log
      - upload.log
